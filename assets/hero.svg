<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144" role="img" aria-labelledby="title">
  <title id="title">Blue crystal with orbital rings</title>
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#83c9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x2="100%" y2="100%">
      <stop stop-color="#e0f8ff"/>
      <stop offset=".48" stop-color="#54cdf9"/>
      <stop offset="1" stop-color="#0872be"/>
    </linearGradient>
    <linearGradient id="blue" x2="100%" y2="100%">
